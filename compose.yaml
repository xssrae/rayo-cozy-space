services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rayo}
      POSTGRES_USER: ${POSTGRES_USER:-rayo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rayo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rayo}:${POSTGRES_PASSWORD:-rayo}@db:5432/${POSTGRES_DB:-rayo}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rayo}:${POSTGRES_PASSWORD:-rayo}@db:5432/${POSTGRES_DB:-rayo}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Rayo Plan <noreply@example.com>}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
